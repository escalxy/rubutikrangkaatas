[env:esp32dev]
platform = espressif32@^6.7.0
board = esp32dev
framework = arduino
lib_deps = 
	bblanchon/ArduinoJson@^7.2.2
	madhephaestus/ESP32Servo@^3.2.1
	rfetick/MPU6050_light@^1.1.0
	waspinator/AccelStepper@^1.64
